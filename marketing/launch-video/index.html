<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hirely AI launch video</title>
<!-- The Hirely AI launch film. Every frame is a pure function of time: window.seek(seconds) poses the whole page,
     so render.mjs can screenshot it frame by frame. Open with ?play to watch it in real time in a browser. -->
<style>
@font-face { font-family: Geist; src: url(fonts/Geist.woff2) format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Geist Mono"; src: url(fonts/GeistMono.woff2) format("woff2"); font-weight: 100 900; }
:root { --bg:#f7f7f4; --ink:#1c1c19; --mute:#65655f; --line:#e4e4de; --blue:#2563eb; --blue2:#3b82f6; --dark:#161616; --green:#059669; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #000; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: var(--bg); overflow: hidden;
  font-family: Geist, Inter, sans-serif; color: var(--ink); transform-origin: 0 0; }
#grid { position: absolute; inset: 0; background:
  repeating-linear-gradient(90deg, transparent 0 239px, #ecece6 239px 240px),
  repeating-linear-gradient(0deg, transparent 0 179px, #ecece6 179px 180px); opacity: .7; }
.abs { position: absolute; }
.scene { position: absolute; inset: 0; opacity: 0; }
.cap { position: absolute; font-size: 62px; font-weight: 500; letter-spacing: -0.025em; line-height: 1.32; white-space: nowrap; }
.cap .w { position: relative; display: inline-block; padding: 0 .16em; margin: 0 -.02em; opacity: 0; }
.cap .hl { position: absolute; inset: .1em 0 .06em 0; background: var(--blue); transform-origin: 0 50%; border-radius: 6px; }
.cap b { position: relative; font-weight: inherit; color: #fff; }
.card { position: absolute; background: #fff; border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 30px 80px rgb(28 28 25 / .08), 0 2px 6px rgb(28 28 25 / .05); }
.card.dark { background: var(--dark); border-color: #262626; color: #ededed; box-shadow: 0 30px 80px rgb(0 0 0 / .25); }
.cd { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--blue); }
.mono { font-family: "Geist Mono", monospace; }
.pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 6px 16px; font-size: 22px; font-weight: 500; }
canvas { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<div id="stage"><div id="grid"></div></div>
<script>
const DUR = 60, W = 1920, H = 1080;
const stage = document.getElementById("stage");
const anims = [], ticks = [], sfx = [];
const EASE = "cubic-bezier(.2,.8,.2,1)", MOVE = "cubic-bezier(.65,0,.35,1)", BACK = "cubic-bezier(.3,1.5,.5,1)";
const BLUE = "#2563eb", INK = "#1c1c19", MUTE = "#65655f", LINE = "#e4e4de";

/* Seeded random, so every render is identical */
let seed = 7;
const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);

function E(tag, cls, parent, style, html) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (style) el.style.cssText = style;
  if (html != null) el.innerHTML = html;
  (parent || stage).appendChild(el);
  return el;
}
/* One animation: holds its end state, has no effect before it starts (so later ones on the same property win) */
function A(el, kf, t0, d = 0.4, ease = EASE) {
  const a = el.animate(kf, { delay: t0 * 1000, duration: Math.max(d, 0.001) * 1000, fill: "forwards", easing: ease });
  a.pause();
  anims.push(a);
}
const fadeIn = (el, t, d = 0.4, dy = 24) => A(el, [{ opacity: 0, transform: `translateY(${dy}px)` }, { opacity: 1, transform: "none" }], t, d);
const fadeOut = (el, t, d = 0.3, dy = -18) => A(el, [{ opacity: 1, transform: "none" }, { opacity: 0, transform: `translateY(${dy}px)` }], t, d, "ease-in");
const pop = (el, t, d = 0.35) => A(el, [{ opacity: 0, transform: "scale(.6)" }, { opacity: 1, transform: "scale(1)" }], t, d, BACK);
function scene(t0, t1, fi = 0, fo = 0) {
  const s = E("div", "scene");
  A(s, [{ opacity: 0 }, { opacity: 1 }], t0, fi);
  A(s, [{ opacity: 1 }, { opacity: 0 }], t1 - fo, fo);
  return s;
}
/* Kinetic caption: each word lands inside a blue highlight; the highlight lets go when the next word lands,
   except on `keep` words (marked with *asterisks* in the source), which stay lit. */
function caption(parent, x, y, lines, t0, o = {}) {
  const step = o.step ?? 0.26;
  const c = E("div", "cap", parent, `left:${x}px;top:${y}px;` + (o.center ? "transform:translateX(-50%);text-align:center;" : "") + (o.size ? `font-size:${o.size}px;` : ""));
  let t = t0;
  lines.forEach((line, li) => {
    const row = E("div", "", c);
    let keep = false;
    line.split(" ").forEach((raw) => {
      if (raw.startsWith("*")) keep = true;
      const word = raw.replaceAll("*", "");
      const w = E("span", "w", row);
      const hl = E("i", "hl", w);
      const b = E("b", "", w, "", word);
      A(w, [{ opacity: 0 }, { opacity: 1 }], t, 0.06);
      A(hl, [{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], t, 0.16);
      if (!keep) {
        A(hl, [{ opacity: 1 }, { opacity: 0 }], t + step, 0.18, "linear");
        A(b, [{ color: "#fff" }, { color: INK }], t + step, 0.18, "linear");
      }
      sfx.push(["tick", t]);
      if (raw.endsWith("*")) keep = false;
      t += step;
    });
    t += o.linePause ?? 0.1;
  });
  c.end = t;
  return c;
}
/* Plain text that types in word by word */
function typeWords(el, str, t0, per = 0.09) {
  str.split(" ").forEach((w, i) => {
    const s = E("span", "", el, "opacity:0", w + " ");
    A(s, [{ opacity: 0 }, { opacity: 1 }], t0 + i * per, 0.08);
  });
  return t0 + str.split(" ").length * per;
}
function cornerDots(card, t) {
  [["-5px", "-5px", "", ""], ["-5px", "", "", "-5px"], ["", "-5px", "-5px", ""], ["", "", "-5px", "-5px"]].forEach(([l, tp, r, b], i) => {
    const d = E("i", "cd", card, `left:${l};top:${tp};right:${r};bottom:${b};opacity:0`);
    if (!l) d.style.left = "auto"; if (!tp) d.style.top = "auto";
    pop(d, t + i * 0.05, 0.3);
  });
}
const MARK = (size, color) => `<svg width="${size}" height="${size}" viewBox="0 0 328 329" fill="${color}" style="display:block;overflow:visible">
<path d="M58 0H328V15L270 73H88L51 110H0V59L58 0Z"/><path d="M276 92H328V143L270 201H88L51 238H0V187L58 128H240L276 92Z"/><path d="M276 220H328V271L270 329H0V315L58 256H240L276 220Z"/></svg>`;
const CHECK = (s = 22, c = "#fff") => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
const CURSOR = `<svg width="54" height="54" viewBox="0 0 24 24" style="display:block;filter:drop-shadow(0 4px 8px rgb(0 0 0/.25))"><path d="M5 3l14 7.2-6.2 1.9L10.6 18 5 3z" fill="#1c1c19" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>`;

/* ---------- Pixel wipe (canvas, drawn from time) ---------- */
const CELL = 40, COLS = W / CELL, ROWS = H / CELL;
const cv = E("canvas", "", stage, "z-index:50"); cv.width = W; cv.height = H;
const cx = cv.getContext("2d");
const TH = [], R2 = [];
for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
  TH.push(((x / COLS) * 0.72 + (1 - y / ROWS) * 0.12 + rnd() * 0.26) / 1.1);
  R2.push(rnd());
}
const wipes = []; // {t0, tc: fully covered, tu: starts uncovering, t1: gone}  (tu/t1 omitted = stays covered, a block takes over)
function drawWipe(t) {
  cx.clearRect(0, 0, W, H);
  for (const w of wipes) {
    if (t < w.t0 || t >= (w.t1 ?? w.tc)) continue;
    const p = Math.min(1, (t - w.t0) / (w.tc - w.t0)) * 1.04;
    const q = w.tu != null && t > w.tu ? ((t - w.tu) / (w.t1 - w.tu)) * 1.04 : -1;
    for (let i = 0; i < TH.length; i++) {
      if (p <= TH[i] || q > TH[i]) continue;
      const edge = Math.min(p - TH[i], q < 0 ? 9 : TH[i] - q);
      cx.fillStyle = edge < 0.07 && R2[i] < 0.22 ? INK : BLUE;
      cx.fillRect((i % COLS) * CELL, Math.floor(i / COLS) * CELL, CELL, CELL);
    }
  }
}
ticks.push(drawWipe);

/* ---------- Logo sting: a full blue frame folds down into the mark, the wordmark follows ---------- */
function logoSting(t0, tOut, extra) {
  const s = scene(t0, tOut, 0, tOut < DUR ? 0.35 : 0);
  s.style.zIndex = 40;
  const word = E("div", "abs", s, "font-size:132px;font-weight:600;letter-spacing:-0.045em;white-space:nowrap;top:0;left:0", "");
  [..."Hirely AI"].forEach((ch, i) => {
    const sp = E("span", "", word, "display:inline-block;opacity:0;white-space:pre", ch);
    A(sp, [{ opacity: 0, transform: "translateX(-22px)" }, { opacity: 1, transform: "none" }], t0 + 1.12 + i * 0.045, 0.3);
  });
  const TILE = 132, GAP = 34, ww = word.getBoundingClientRect().width / scaleNow();
  const left = (W - (TILE + GAP + ww)) / 2, top = extra ? 400 : 430;
  word.style.left = left + TILE + GAP + "px"; word.style.top = top + (TILE - 132 * 1.2) / 2 + "px"; word.style.lineHeight = 1.2;
  const blk = E("div", "abs", s, `left:0;top:0;width:${W}px;height:${H}px;background:${BLUE}`);
  A(blk, [{ left: "0px", top: "0px", width: W + "px", height: H + "px", borderRadius: "0px", background: BLUE },
          { left: left + "px", top: top + "px", width: TILE + "px", height: TILE + "px", borderRadius: "30px", background: INK }], t0 + 0.7, 0.55, "cubic-bezier(.7,0,.2,1)");
  const mk = E("div", "abs", s, `left:${W / 2 - 110}px;top:${H / 2 - 110}px;width:220px;height:220px;transform-origin:0 0`, MARK(220, "#fff"));
  [...mk.querySelectorAll("path")].forEach((p, i) => { p.style.opacity = 0; A(p, [{ opacity: 0, transform: "translateX(-90px)" }, { opacity: 1, transform: "none" }], t0 + 0.08 + i * 0.09, 0.4); });
  const ms = 72 / 220;
  A(mk, [{ transform: "none" }, { transform: `translate(${left + (TILE - 72) / 2 - (W / 2 - 110)}px, ${top + (TILE - 72) / 2 - (H / 2 - 110)}px) scale(${ms})` }], t0 + 0.7, 0.55, "cubic-bezier(.7,0,.2,1)");
  sfx.push(["impact", t0], ["whoosh", t0 + 0.6]);
  return { s, top, TILE };
}
const scaleNow = () => stage.getBoundingClientRect().width / W;

function build() {
  /* ===== 1. The problem (0 – 8) ===== */
  {
    const s = scene(0, 8);
    // Opening beat: four dots fly in and frame the first words
    const c0 = caption(s, 960, 480, ["One job post."], 0.45, { center: true, step: 0.3, size: 76 });
    const r = c0.getBoundingClientRect(), k = scaleNow();
    const bx = r.left / k - 26, by = r.top / k - 14, bw = r.width / k + 52, bh = r.height / k + 28;
    [[0, 0], [1, 0], [0, 1], [1, 1]].forEach(([ix, iy], i) => {
      const d = E("i", "cd", s, `left:${bx + ix * bw - 5}px;top:${by + iy * bh - 5}px;opacity:0`);
      const fx = (rnd() - 0.5) * 1800, fy = (rnd() - 0.5) * 1000;
      A(d, [{ opacity: 1, transform: `translate(${fx}px,${fy}px)` }, { opacity: 1, transform: "none" }], 0.1 + i * 0.07, 0.75, "cubic-bezier(.5,0,.1,1)");
      A(d, [{ opacity: 1 }, { opacity: 0 }], 1.95, 0.2);
    });
    const box = E("div", "abs", s, `left:${bx}px;top:${by}px;width:${bw}px;height:${bh}px;background:${BLUE};opacity:0;border-radius:10px;z-index:-1`);
    A(box, [{ opacity: 0 }, { opacity: 0.1 }], 1.25, 0.3);
    A(box, [{ opacity: 0.1 }, { opacity: 0 }], 1.95, 0.2);
    fadeOut(c0, 1.95, 0.25);

    const a = caption(s, 140, 300, ["One job post.", "*400 applicants.*"], 2.25);
    const b = caption(s, 140, 520, ["Time to call", "*maybe ten.*"], 4.5);
    const note = E("div", "abs", s, `left:156px;top:716px;font-size:34px;color:${MUTE};opacity:0`, "The rest never get a conversation.");
    fadeIn(note, 6.0, 0.5, 14);

    // The pile: 400 tiles, then only ten survive
    const GX = 940, GY = 290, P = 34, T = 26, CN = 25, RN = 16;
    const frame = E("div", "card", s, `left:${GX - 40}px;top:${GY - 110}px;width:${CN * P - 8 + 80}px;height:${RN * P - 8 + 150}px;opacity:0`);
    A(frame, [{ opacity: 0, transform: "scale(.2)" }, { opacity: 1, transform: "scale(1)" }], 2.15, 0.55);
    cornerDots(frame, 2.5);
    const count = E("div", "abs mono", frame, `left:40px;top:34px;font-size:30px;font-weight:500`, "");
    const sub = E("div", "abs", frame, `right:40px;top:38px;font-size:24px;color:${MUTE}`, "Senior Backend Engineer");
    const keepers = new Set(); while (keepers.size < 10) keepers.add(Math.floor(rnd() * CN * RN));
    for (let i = 0; i < CN * RN; i++) {
      const tl = E("i", "abs", s, `left:${GX + (i % CN) * P}px;top:${GY + Math.floor(i / CN) * P}px;width:${T}px;height:${T}px;border-radius:5px;background:${BLUE};opacity:0`);
      const t = 2.7 + (i / (CN * RN)) * 1.5 + rnd() * 0.12;
      A(tl, [{ opacity: 0, transform: "scale(.2)" }, { opacity: 1, transform: "scale(1)" }], t, 0.18);
      if (keepers.has(i)) A(tl, [{ transform: "scale(1)" }, { transform: "scale(1.5)" }, { transform: "scale(1.2)" }], 5.0, 0.4);
      else A(tl, [{ background: BLUE }, { background: "#e2e2dc" }], 4.95 + rnd() * 0.35, 0.3, "linear");
    }
    ticks.push((t) => {
      if (t < 4.95) count.textContent = String(Math.round(400 * Math.min(1, Math.max(0, (t - 2.7) / 1.6)))).padStart(3, "0") + " applicants";
      else count.innerHTML = `<span style="color:${BLUE}">010 interviews</span>`;
    });
    sfx.push(["riser", 6.0], ["pop", 5.0]);
    wipes.push({ t0: 7.25, tc: 8.0 }); sfx.push(["whoosh", 7.25]);
  }

  /* ===== 2. Logo (8 – 12) ===== */
  {
    const { s } = logoSting(8, 12);
    caption(s, 960, 640, ["Hire on *signal,* not on resumes."], 9.9, { center: true, size: 54, step: 0.24 });
  }

  /* ===== 3. Voice interview (12 – 20) ===== */
  {
    const s = scene(12, 20, 0.3);
    caption(s, 130, 330, ["Every applicant", "gets a *real interview.*"], 12.4);
    caption(s, 130, 560, ["Five minutes.", "By voice.", "*Run by AI.*"], 15.6, { size: 46, step: 0.3, linePause: 0.25 });

    const cd = E("div", "card dark", s, "left:830px;top:170px;width:960px;height:740px;opacity:0");
    A(cd, [{ opacity: 0, transform: "scale(.12)" }, { opacity: 1, transform: "scale(1)" }], 12.1, 0.7);
    cornerDots(cd, 12.6);
    E("div", "abs", cd, "left:36px;top:30px;font-size:24px;font-weight:500;display:flex;align-items:center;gap:12px", `<i style="width:12px;height:12px;border-radius:50%;background:#ff6166;display:block"></i>Voice interview <span style="color:#a1a1a1;font-weight:400">· Senior Backend Engineer</span>`);
    const timer = E("div", "abs mono", cd, "right:36px;top:28px;font-size:26px;color:#ededed", "05:00");
    ticks.push((t) => { const left = Math.max(0, 300 - Math.max(0, t - 13) * 38); timer.textContent = "0" + Math.floor(left / 60) + ":" + String(Math.floor(left % 60)).padStart(2, "0"); });
    const mk = (x, label, who) => {
      const tile = E("div", "abs", cd, `left:${x}px;top:92px;width:426px;height:280px;border-radius:14px;background:#1c1c1c;border:2px solid #262626`);
      E("div", "abs", tile, "left:20px;bottom:16px;font-size:20px;color:#a1a1a1", `<span style="color:#ededed;font-weight:500">${label}</span> · ${who}`);
      return tile;
    };
    const ai = mk(36, "Hirely AI", "Interviewer"), me = mk(498, "Priya S.", "Candidate");
    const orb = E("div", "abs", ai, `left:153px;top:60px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #93c5fd, ${BLUE} 55%, #1e3a8a)`);
    const halo = E("div", "abs", ai, `left:133px;top:40px;width:160px;height:160px;border-radius:50%;border:2px solid ${BLUE};opacity:.5`);
    E("div", "abs", me, `left:163px;top:36px;width:100px;height:100px;border-radius:50%;background:#2a2a2a;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:500;color:#ededed`, "PS");
    const bars = []; for (let i = 0; i < 27; i++) bars.push(E("i", "abs", me, `left:${88 + i * 9.4}px;top:176px;width:5px;height:40px;border-radius:3px;background:#34d399;transform-origin:50% 50%`));
    // Who is talking: AI 13.0–15.2, candidate 15.6–19.4
    const env = (t, a, b) => Math.max(0, Math.min(1, (t - a) / 0.25, (b - t) / 0.25));
    ticks.push((t) => {
      const ea = env(t, 13.0, 15.2), ec = env(t, 15.6, 19.4);
      const pulse = 1 + ea * (0.07 + 0.06 * Math.sin(t * 19) * Math.sin(t * 7.3));
      orb.style.transform = `scale(${pulse})`;
      halo.style.transform = `scale(${1 + ea * (0.12 + 0.1 * Math.abs(Math.sin(t * 5.1)))})`;
      halo.style.opacity = 0.15 + ea * 0.5;
      ai.style.borderColor = ea > 0.5 ? BLUE : "#262626";
      me.style.borderColor = ec > 0.5 ? "#34d399" : "#262626";
      bars.forEach((b, i) => { const v = Math.abs(Math.sin(t * 11 + i * 0.9) * Math.sin(t * 6.3 + i * 1.7)); b.style.transform = `scaleY(${0.1 + ec * (0.15 + 1.25 * v)})`; });
    });
    const line = (y, who, color) => {
      const row = E("div", "abs", cd, `left:36px;top:${y}px;width:888px;font-size:27px;line-height:1.45;color:#ededed`);
      const tag = E("span", "mono", row, `font-size:19px;color:${color};display:block;margin-bottom:4px;opacity:0`, who);
      return [row, tag];
    };
    const [l1, t1] = line(404, "HIRELY AI", "#52a8ff"), [l2, t2] = line(530, "PRIYA S.", "#34d399");
    A(t1, [{ opacity: 0 }, { opacity: 1 }], 13.0, 0.2); typeWords(l1, "Tell me about a system you had to scale under pressure. What broke first?", 13.1, 0.14);
    A(t2, [{ opacity: 0 }, { opacity: 1 }], 15.6, 0.2); typeWords(l2, "Our job queue. We split the workers by priority, added backpressure, and cut p99 latency by sixty percent in two sprints.", 15.7, 0.16);
    sfx.push(["pop", 12.1], ["pop", 13.0], ["pop", 15.6]);
    wipes.push({ t0: 19.35, tc: 20.0, tu: 20.0, t1: 20.6 }); sfx.push(["whoosh", 19.35]);
  }

  /* ===== 4. The report (20 – 28) ===== */
  {
    const s = scene(20, 28, 0, 0.35);
    const cd = E("div", "card", s, "left:130px;top:150px;width:900px;height:780px");
    cornerDots(cd, 20.5);
    E("div", "abs", cd, `left:44px;top:36px;font-size:22px;color:${MUTE}`, "Interview report");
    E("div", "abs", cd, "left:44px;top:70px;font-size:36px;font-weight:600;letter-spacing:-0.02em", "Priya S.");
    E("div", "abs", cd, `left:44px;top:120px;font-size:22px;color:${MUTE}`, "Senior Backend Engineer · 5 min voice interview");
    // Score ring
    const C = 2 * Math.PI * 74;
    const ring = E("div", "abs", cd, "right:44px;top:34px;width:180px;height:180px", `<svg width="180" height="180" viewBox="0 0 180 180"><circle cx="90" cy="90" r="74" fill="none" stroke="#efefea" stroke-width="13"/><circle id="arc" cx="90" cy="90" r="74" fill="none" stroke="${BLUE}" stroke-width="13" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 90 90)"/></svg>`);
    A(ring.querySelector("#arc"), [{ strokeDashoffset: C }, { strokeDashoffset: C * (1 - 0.87) }], 20.9, 1.3, "cubic-bezier(.3,0,.1,1)");
    const num = E("div", "abs", ring, "inset:0;display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:600;letter-spacing:-0.03em", "0");
    const ez = (x) => 1 - Math.pow(1 - Math.max(0, Math.min(1, x)), 3);
    ticks.push((t) => { num.textContent = Math.round(87 * ez((t - 20.9) / 1.3)); });
    const fit = E("div", "abs pill", cd, `left:44px;top:170px;background:#e7f6ef;color:#059669;opacity:0;gap:8px`, CHECK(20, "#059669") + "Strong fit");
    pop(fit, 22.2);
    E("div", "abs", cd, `left:44px;top:240px;right:44px;height:1px;background:${LINE}`);
    [["System design", 92], ["Communication", 85], ["Ownership", 88], ["Role fit", 84]].forEach(([n, v], i) => {
      const y = 272 + i * 62, t = 22.6 + i * 0.28;
      const lab = E("div", "abs", cd, `left:44px;top:${y}px;font-size:25px;opacity:0`, n); fadeIn(lab, t, 0.3, 8);
      const tr = E("div", "abs", cd, `left:300px;top:${y + 12}px;width:470px;height:10px;border-radius:5px;background:#efefea`);
      const fill = E("div", "abs", tr, `left:0;top:0;height:10px;width:${v}%;border-radius:5px;background:${BLUE};transform-origin:0 50%;transform:scaleX(0)`);
      A(fill, [{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], t, 0.7);
      const val = E("div", "abs mono", cd, `right:44px;top:${y}px;font-size:25px;font-weight:500`, "0");
      ticks.push((tt) => { val.textContent = Math.round(v * ez((tt - t) / 0.7)); });
      sfx.push(["tick", t]);
    });
    E("div", "abs", cd, `left:44px;top:530px;right:44px;height:1px;background:${LINE}`);
    [["Strengths", "Clear trade-off reasoning under load", "#059669", "+"], ["", "Measured impact: p99 latency down 60%", "#059669", "+"], ["Concerns", "Limited experience leading a team", "#b45309", "!"]].forEach(([h, txt, col, sym], i) => {
      const y = 556 + i * 66, t = 24.3 + i * 0.5;
      const row = E("div", "abs", cd, `left:44px;top:${y}px;right:44px;font-size:25px;display:flex;gap:16px;align-items:center;opacity:0`,
        `<span class="mono" style="width:34px;height:34px;border-radius:9px;background:${col}1c;color:${col};display:flex;align-items:center;justify-content:center;font-weight:600">${sym}</span><span></span>`);
      fadeIn(row, t, 0.3, 10); typeWords(row.lastChild, txt, t + 0.1, 0.07); sfx.push(["pop", t]);
    });
    caption(s, 1110, 330, ["Scored against", "*the job description.*"], 20.7);
    caption(s, 1110, 560, ["With the reasoning", "behind *every score.*"], 24.6, { size: 46 });
  }

  /* ===== 5. The shortlist (28 – 36) ===== */
  {
    const s = scene(28, 36, 0.35, 0.3);
    caption(s, 130, 330, ["400 applicants in.", "*A ranked shortlist* out."], 28.3);
    const sub = caption(s, 130, 560, ["No phone screens.", "*No scheduling.*"], 32.4, { size: 46, linePause: 0.2 });
    const cd = E("div", "card", s, "left:900px;top:150px;width:890px;height:780px;opacity:0;overflow:hidden");
    fadeIn(cd, 28.2, 0.5, 40);
    E("div", "abs", cd, "left:40px;top:32px;font-size:28px;font-weight:600;letter-spacing:-0.02em", "Applicants");
    const mode = E("div", "abs mono", cd, `right:40px;top:36px;font-size:20px;color:${MUTE}`, "");
    ticks.push((t) => { mode.textContent = t < 30.5 ? "sorted by · date applied" : "sorted by · interview score"; mode.style.color = t < 30.5 ? MUTE : BLUE; });
    E("div", "abs", cd, `left:0;top:92px;right:0;height:1px;background:${LINE}`);
    const people = [["Marcus L.", 71, "Possible fit"], ["Aiko T.", 82, "Good fit"], ["Sam O.", 52, "Weak fit"], ["Priya S.", 87, "Strong fit"], ["Elena V.", 64, "Possible fit"], ["Daniel K.", 84, "Strong fit"]];
    const order = [...people].sort((a, b) => b[1] - a[1]);
    const RH = 108;
    let topBtn;
    people.forEach(([n, sc, f], i) => {
      const rank = order.findIndex((p) => p[0] === n), short = rank < 3;
      const row = E("div", "abs", cd, `left:0;top:${100 + i * RH}px;width:100%;height:${RH}px;display:flex;align-items:center;padding:0 40px;gap:22px;opacity:0;border-left:6px solid transparent`);
      fadeIn(row, 28.6 + i * 0.09, 0.35, 16);
      A(row, [{ transform: "none" }, { transform: `translateY(${(rank - i) * RH}px)` }], 30.5 + rank * 0.05, 0.75, MOVE);
      if (short) A(row, [{ background: "#fff", borderLeftColor: "transparent" }, { background: "#eff5ff", borderLeftColor: BLUE }], 31.5 + rank * 0.14, 0.3);
      else A(row, [{ opacity: 1 }, { opacity: 0.38 }], 31.9, 0.4);
      const rk = E("div", "mono", row, `width:34px;font-size:22px;color:${MUTE}`, "");
      ticks.push((t) => { rk.textContent = t < 30.9 ? "" : "#" + (rank + 1); });
      E("div", "", row, `width:54px;height:54px;border-radius:50%;background:${short ? "#dbe7ff" : "#efefea"};display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;color:${short ? BLUE : MUTE};flex:none`, n.split(" ").map((x) => x[0]).join(""));
      E("div", "", row, "flex:1;font-size:27px;font-weight:500", `${n}<div style="font-size:20px;font-weight:400;color:${MUTE};margin-top:2px">${f}</div>`);
      if (rank === 0) {
        topBtn = E("div", "", row, `font-size:20px;font-weight:500;padding:9px 18px;border-radius:9px;background:${BLUE};color:#fff;opacity:0;white-space:nowrap`, "Advance →");
        pop(topBtn, 32.2);
        A(topBtn, [{ transform: "scale(1)" }, { transform: "scale(.92)" }, { transform: "scale(1)" }], 34.3, 0.25);
        A(topBtn, [{ background: BLUE }, { background: "#059669" }], 34.4, 0.2);
        ticks.push((t) => { topBtn.textContent = t < 34.4 ? "Advance →" : "✓ Advanced"; });
      }
      const scEl = E("div", "mono", row, `font-size:30px;font-weight:600;width:60px;text-align:right;color:${short ? BLUE : INK}`, "0");
      ticks.push((t) => { scEl.textContent = Math.round(sc * Math.min(1, Math.max(0, (t - 29.2 - i * 0.08) / 0.8))); });
    });
    sfx.push(["whoosh", 30.45], ["pop", 31.5], ["pop", 31.64], ["pop", 31.78], ["click", 34.3]);
    const cur = E("div", "abs", s, "left:0;top:0;opacity:0;z-index:5", CURSOR);
    A(cur, [{ opacity: 0, transform: "translate(1700px,1000px)" }, { opacity: 1, transform: "translate(1592px,298px)" }], 33.2, 1.0, MOVE);
    A(cur, [{ transform: "translate(1592px,298px) scale(1)" }, { transform: "translate(1592px,298px) scale(.82)" }, { transform: "translate(1592px,298px) scale(1)" }], 34.25, 0.25);
    const rip = E("div", "abs", s, `left:1560px;top:264px;width:80px;height:80px;border-radius:50%;border:3px solid ${BLUE};opacity:0`);
    A(rip, [{ opacity: 0.8, transform: "scale(.3)" }, { opacity: 0, transform: "scale(1.8)" }], 34.3, 0.5);
  }

  /* ===== 6. Built for both sides + everything around it (36 – 46) ===== */
  {
    const s = scene(36, 46, 0.2, 0.3);
    const g1 = E("div", "abs", s, "inset:0");
    // The big arrow and caret shrink into a typed line, as if the film takes a breath
    const arrow = E("div", "abs", g1, `left:0;top:0;transform-origin:0 0`, `<svg width="400" height="240" viewBox="0 0 400 240" fill="none" stroke="${BLUE}" stroke-width="16"><path d="M20 120h250M180 30l95 90-95 90"/><path id="car" d="M370 20v200"/></svg>`);
    const big = "translate(760px,420px) scale(1)", small = "translate(455px,471px) scale(.24)";
    A(arrow, [{ opacity: 0, transform: "translate(660px,420px) scale(1)" }, { opacity: 1, transform: big }], 36.15, 0.35);
    A(arrow, [{ transform: big }, { transform: small }], 37.0, 0.45, "cubic-bezier(.7,0,.2,1)");
    ticks.push((t) => { arrow.querySelector("#car").style.opacity = t > 37.5 ? 0 : Math.floor(t * 3.2) % 2 ? 0.15 : 1; });
    const lead = E("div", "abs", g1, "left:580px;top:455px;font-size:68px;font-weight:500;letter-spacing:-0.025em;opacity:0", "Built for");
    fadeIn(lead, 37.4, 0.25, 0);
    const chipX = 580 + 300;
    [["recruiters", 37.8, 39.5, "Replace phone screens with a ranked shortlist."], ["candidates", 39.5, 41.2, "Interview on your schedule. Hear back fast."]].forEach(([w, a, b, line]) => {
      const chip = E("div", "abs mono", g1, `left:${chipX}px;top:448px;font-size:62px;font-weight:500;background:${BLUE};color:#fff;padding:6px 30px 10px;border-radius:12px;opacity:0;transform-origin:0 50%`, w);
      A(chip, [{ opacity: 1, transform: "scaleX(0)" }, { opacity: 1, transform: "scaleX(1)" }], a, 0.28);
      A(chip, [{ opacity: 1, transform: "translateY(0)" }, { opacity: 0, transform: "translateY(-26px)" }], b - 0.2, 0.2, "ease-in");
      const ln = E("div", "abs", g1, `left:580px;top:580px;font-size:36px;color:${MUTE};opacity:0`, line);
      fadeIn(ln, a + 0.25, 0.35, 12); fadeOut(ln, b - 0.25, 0.2);
      sfx.push(["pop", a]);
    });
    fadeOut(g1, 41.0, 0.3);
    sfx.push(["whoosh", 36.95]);

    const g2 = E("div", "abs", s, "inset:0");
    caption(g2, 960, 235, ["And *everything* around the interview."], 41.4, { center: true, step: 0.22 });
    const feats = [["Resume in, profile out", "Upload a PDF. Your profile fills itself in.", "M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6"],
      ["Timed MCQ screening", "AI-written or your own. Graded on the server.", "M12 7v5l3 2M12 3a9 9 0 100 18 9 9 0 000-18z"],
      ["Verified company pages", "One page per domain, proven by work email.", "M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6zM9 12l2 2 4-4"],
      ["Network and feed", "Posts, follows and connections, in real time.", "M7 8a3 3 0 106 0 3 3 0 00-6 0M3 20c0-4 3-6 7-6s7 2 7 6M17 5a3 3 0 010 6M21 20c0-3-1-5-3-6"]];
    feats.forEach(([h, d, path], i) => {
      const x = 250 + (i % 2) * 730, y = 420 + Math.floor(i / 2) * 230, t = 42.5 + i * 0.6;
      const c = E("div", "card", g2, `left:${x}px;top:${y}px;width:690px;height:190px;opacity:0`);
      pop(c, t, 0.45);
      E("div", "abs", c, `left:34px;top:34px;width:64px;height:64px;border-radius:16px;background:#eff5ff;display:flex;align-items:center;justify-content:center`, `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="${BLUE}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${path}"/></svg>`);
      E("div", "abs", c, "left:124px;top:38px;font-size:32px;font-weight:600;letter-spacing:-0.02em", h);
      E("div", "abs", c, `left:124px;top:92px;font-size:24px;color:${MUTE};width:520px;line-height:1.35`, d);
      const ck = E("div", "abs", c, `right:-14px;top:-14px;width:44px;height:44px;border-radius:50%;background:${BLUE};display:flex;align-items:center;justify-content:center;opacity:0`, CHECK(24));
      pop(ck, t + 0.3, 0.3);
      sfx.push(["pop", t], ["tick", t + 0.3]);
    });
  }

  /* ===== 7. Call to action (46 – 54) ===== */
  {
    const s = scene(46, 54, 0.3);
    caption(s, 510, 250, ["*Free* to start."], 46.4, { size: 84, step: 0.3 });
    ["Profiles, job posts and applications cost nothing", "The first round runs itself, for every applicant", "You meet the right people, faster"].forEach((txt, i) => {
      const t = 47.6 + i * 0.7;
      const row = E("div", "abs", s, `left:522px;top:${410 + i * 68}px;font-size:36px;display:flex;gap:20px;align-items:center;opacity:0`, `<span style="display:flex">${CHECK(32, BLUE)}</span><span style="color:${MUTE}"></span>`);
      A(row, [{ opacity: 0 }, { opacity: 1 }], t, 0.15); typeWords(row.lastChild, txt, t + 0.05, 0.07); sfx.push(["tick", t]);
    });
    const btn = E("div", "abs", s, `left:520px;top:660px;width:880px;height:112px;border-radius:16px;background:linear-gradient(#3b82f6,#2563eb);box-shadow:0 0 0 1px rgb(0 0 0/.14), inset 0 2px 0 rgb(255 255 255/.28), 0 18px 40px rgb(37 99 235/.35);color:#fff;font-size:40px;font-weight:500;display:flex;align-items:center;justify-content:space-between;padding:0 44px;opacity:0;transform-origin:50% 50%`,
      `<span>Get started</span><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>`);
    A(btn, [{ opacity: 0, transform: "scaleX(.15)" }, { opacity: 1, transform: "scaleX(1)" }], 49.7, 0.5);
    const url = E("div", "abs mono", s, `left:520px;top:806px;width:880px;text-align:center;font-size:26px;color:${MUTE};opacity:0`, "hire-excellence.n1m35h.in");
    fadeIn(url, 50.3, 0.4, 10);
    const cur = E("div", "abs", s, "left:0;top:0;opacity:0;z-index:5", CURSOR);
    const at = "translate(1180px,716px)";
    A(cur, [{ opacity: 0, transform: "translate(1560px,1010px)" }, { opacity: 1, transform: at }], 50.6, 0.9, MOVE);
    A(cur, [{ transform: at + " scale(1)" }, { transform: at + " scale(.82)" }, { transform: at + " scale(1)" }], 51.75, 0.25);
    A(btn, [{ transform: "scale(1)" }, { transform: "scale(.965)" }, { transform: "scale(1.02)" }, { transform: "scale(1)" }], 51.8, 0.45);
    for (let i = 0; i < 2; i++) {
      const rip = E("div", "abs", s, `left:520px;top:660px;width:880px;height:112px;border-radius:16px;border:3px solid ${BLUE};opacity:0`);
      A(rip, [{ opacity: 0.7, transform: "scale(1)" }, { opacity: 0, transform: "scale(1.12,1.7)" }], 51.85 + i * 0.25, 0.7);
    }
    sfx.push(["pop", 49.7], ["click", 51.8], ["riser", 52.0], ["whoosh", 53.25]);
    wipes.push({ t0: 53.25, tc: 54.0 });
  }

  /* ===== 8. End card (54 – 60) ===== */
  {
    const { s, top, TILE } = logoSting(54, DUR, true);
    caption(s, 960, top + TILE + 64, ["Hire on *signal.*"], 55.7, { center: true, size: 54, step: 0.3 });
    const url = E("div", "abs mono", s, `left:0;width:${W}px;top:${top + TILE + 190}px;text-align:center;font-size:30px;color:${MUTE};opacity:0`, "hire-excellence.n1m35h.in");
    fadeIn(url, 56.8, 0.5, 12);
    const free = E("div", "abs", s, `left:0;width:${W}px;top:${top + TILE + 250}px;text-align:center;font-size:24px;color:#9a9a93;opacity:0`, "Free for candidates and recruiters");
    fadeIn(free, 57.3, 0.5, 12);
  }
}

window.seek = (t) => {
  for (const a of anims) a.currentTime = t * 1000;
  for (const f of ticks) f(t);
};
window.ready = document.fonts.load('500 20px Geist').then(() => document.fonts.load('500 20px "Geist Mono"')).then(() => document.fonts.ready).then(() => {
  build();
  window.SFX = sfx;
  seek(0);
  if (location.search.includes("play")) {
    const fit = () => { stage.style.transform = `scale(${Math.min(innerWidth / W, innerHeight / H)})`; };
    fit(); addEventListener("resize", fit);
    const t0 = performance.now() - (parseFloat(new URLSearchParams(location.search).get("play")) || 0) * 1000;
    const loop = () => { seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); };
    loop();
  }
  return true;
});
</script>
</body>
</html>
