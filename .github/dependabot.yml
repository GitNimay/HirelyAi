version: 2
# Routine version updates arrive once a month; security fixes (Dependabot security updates, repo setting) open immediately regardless
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 5 } # let fresh releases age before they're proposed (supply-chain safety)
    commit-message: { prefix: deps }
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /interview-agent
    schedule: { interval: monthly }
    cooldown: { default-days: 5 }
    commit-message: { prefix: deps(agent) }
    labels: [dependencies, "area: interview-agent"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 5 }
    commit-message: { prefix: ci }
    labels: [dependencies, "area: ci"]
    groups:
      actions:
        patterns: ["*"]
