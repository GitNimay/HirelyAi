name: CI
on:
  pull_request:
  push:
    branches: [main]

# No token scopes unless a job asks for them
permissions: {}

# A new push to a PR cancels its stale run; pushes to main always finish (they deploy)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # Vitest: unit tests (lib/, app/) and integration tests against a real local D1/R2 built from migrations/.
  # Runs alongside build (it doesn't need it) and fails under the coverage floor in vitest.config.ts.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # github-actions reporter: failures show as annotations on the PR's changed lines
      - run: npm run test:coverage -- --reporter=default --reporter=github-actions
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          {
            echo "### Coverage"
            echo
            echo "| | % |"
            echo "|---|---|"
            jq -r '.total | to_entries[] | "| \(.key) | \(.value.pct) |"' coverage/coverage-summary.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Throwaway, well-formed test key so Clerk middleware boots in the integration job (prod key lives in the production environment)
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          # .wrangler/deploy/config.json points `vite preview` and `wrangler` at dist/server/wrangler.json
          path: |
            dist/
            .wrangler/deploy/config.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # Boots the built Worker in workerd with a local D1 (every migration applied) and hits it over HTTP
  integration:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - run: npx wrangler d1 migrations apply hire-excellence-db --local
      - name: Smoke test the built Worker
        run: |
          printf 'CLERK_SECRET_KEY=sk_test_ci_dummy\nNEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=%s\n' "$PK" | tee .dev.vars > dist/server/.dev.vars
          npx vite preview --port 4173 > preview.log 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://localhost:4173/api/health > health.json 2>/dev/null && break; sleep 2; done
          cat preview.log health.json
          grep -q '"ok":true' health.json
          curl -fsS -o /dev/null http://localhost:4173/
        env:
          PK: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk

  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: voice-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Resolve the store from voice-agent/ so corepack uses its pinned pnpm (setup-node's own cache looks from the repo root)
      - id: pnpm-store
        run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('voice-agent/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  # Blocks PRs that add vulnerable or copyleft-licensed dependencies
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # summary comment on failure
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development
          deny-licenses: GPL-2.0-only, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
          comment-summary-in-pr: on-failure

  # AI review, PRs only (never on the push to main that deploys). Runs once every check above has passed, so a broken
  # PR spends no model tokens. OpenCode (free Zen GLM 5.3) runs alibaba/open-code-review's delegate skill against
  # .github/ai-review-rules.md. A BLOCK verdict fails CI OK; the ai-review-override label lets a false positive through.
  # Fails open: a missing key, model error or rate limit posts a warning and never blocks.
  # Same-repo, non-Dependabot PRs only: forks and Dependabot don't get OPENCODE_API_KEY.
  ai-review:
    needs: [lint, format, typecheck, test, build, integration, agent, dependency-review]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # review comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # OCR needs the merge base with the target branch
          persist-credentials: false
      # Every file that steers the agent (rules, skills, agent instructions, OpenCode config) comes from the base branch,
      # or is removed, so a PR can't talk its own review into a PASS. Only the rules file falls back to the PR's copy,
      # once, for the PR that first adds it.
      - name: Use review config from the base branch
        run: |
          for p in .github/ai-review-rules.md .opencode .claude AGENTS.md CLAUDE.md opencode.json opencode.jsonc; do
            if git cat-file -e "origin/$BASE:$p" 2>/dev/null; then rm -rf "$p"; git checkout "origin/$BASE" -- "$p"
            elif [ "$p" != .github/ai-review-rules.md ]; then rm -rf "$p"; fi
          done
        env:
          BASE: ${{ github.base_ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm i -g @opencode/cli@2.2.5 @alibaba-group/open-code-review@1.13.3
      # No GitHub token in this step: the agent runs shell commands on PR content, so it only gets the model key
      - name: Review
        run: |
          skip() { echo "::warning::$1"; printf 'VERDICT: SKIPPED\n\n> [!WARNING]\n> %s Not blocking this PR.\n' "$1" > review.md; exit 0; }
          [ -n "$OPENCODE_API_KEY" ] || skip "AI review skipped: OPENCODE_API_KEY is not configured."
          # The exit code is ignored on purpose: a review.md with a verdict counts even if the agent exits non-zero after writing it
          opencode run --auto -m 'opencode/glm-5.3-flash-free#high' \
            "Review this pull request with the open-code-review-delegate skill in range mode (--from origin/$BASE --to HEAD), passing --background-file .github/ai-review-rules.md to ocr delegate preview. Enforce the project rules in .github/ai-review-rules.md on top of the OCR rules. Report only real findings. Write two files in the repo root and modify nothing else. (1) review.md, GitHub markdown: its first line must be exactly 'VERDICT: BLOCK' if there is any critical or high severity issue or any violation of a BLOCK rule, otherwise exactly 'VERDICT: PASS'. Then one plain sentence summing up the PR, then a line 'Reviewed X of Y files.', then a '### Blocking' and a '### Non-blocking' list, leaving out a heading that has no findings. Each finding is one bullet: the path:line in backticks, the severity in bold, then what is wrong and how to fix it in at most two short sentences. Nothing else: no list of rules checked, no praise, no recap. (2) findings.json: a JSON array with one object per finding, {\"path\": repo-relative path, \"line\": line number in the new file, \"severity\": \"critical\"|\"high\"|\"medium\"|\"low\", \"blocking\": true|false, \"body\": what is wrong and the fix in at most two short sentences}; write [] when there are none. Writing style for both files: short, simple, direct English; no emojis; no em dashes, en dashes or double hyphens (use a comma, colon or full stop instead)." \
            || echo "::warning::opencode exited non-zero"
          [ -f review.md ] || skip "AI review could not finish (model error or usage limit). Re-run the job to try again."
          head -1 review.md | tr -d '\r' | grep -qxE 'VERDICT: (PASS|BLOCK)' || skip "AI review returned no verdict."
        env:
          BASE: ${{ github.base_ref }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      # One summary comment per PR for every verdict (pass, block or skipped), updated on every push
      - name: Post summary comment
        run: |
          sed -e '1s/\r$//' \
              -e '1s/^VERDICT: PASS$/## AI review: passed/' \
              -e '1s/^VERDICT: BLOCK$/## AI review: blocked/' \
              -e '1s/^VERDICT: SKIPPED$/## AI review: skipped/' review.md > comment.md
          gh pr comment "$PR" --body-file comment.md --edit-last --create-if-none
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
      # Each finding also goes on its line in "Files changed". Best effort: GitHub rejects lines outside the diff,
      # and a finding already commented on that line by an earlier run isn't repeated.
      - name: Comment findings on their lines
        if: hashFiles('findings.json') != ''
        continue-on-error: true
        run: |
          jq -e 'type == "array"' findings.json > /dev/null || { echo "::warning::findings.json is not a JSON array"; exit 0; }
          seen=$(gh api --paginate "repos/$REPO/pulls/$PR/comments" --jq '.[] | select(.body | contains("<!-- ai-review -->")) | "\(.path):\(.line)"')
          jq -c '.[] | select(.path and .line)' findings.json | while read -r f; do
            key=$(jq -r '"\(.path):\(.line)"' <<< "$f")
            grep -qxF "$key" <<< "$seen" && continue
            jq --arg sha "$SHA" '{
                body: ("**" + (if .blocking then "Blocking" else "Non-blocking" end) + ", \(.severity // "note")**: \(.body)\n\n<!-- ai-review -->"),
                path, line: (.line | tonumber), side: "RIGHT", commit_id: $sha
              }' <<< "$f" | gh api "repos/$REPO/pulls/$PR/comments" --input - > /dev/null \
              || echo "::notice::No inline comment for $key (line is outside the diff); it is in the summary comment"
          done
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
      - name: Gate on verdict
        run: |
          head -1 review.md | tr -d '\r' | grep -qx 'VERDICT: BLOCK' || exit 0
          if gh pr view "$PR" --json labels --jq '.labels[].name' | grep -qx ai-review-override; then
            echo "::warning::Blocking AI findings overridden by the ai-review-override label"; exit 0
          fi
          echo "::error::AI review found blocking issues, see the PR comment. Fix them, or add the ai-review-override label and re-run failed jobs."
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}

  # The one required status check: add jobs above freely without touching the ruleset
  ci-ok:
    name: CI OK
    if: always()
    needs: [lint, format, typecheck, test, build, integration, agent, dependency-review, ai-review]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All checks passed"

  # Merge to main = production deploy. Runs only after every check passes on the merge commit.
  deploy:
    needs: ci-ok
    # !cancelled() + explicit result: without a status function, the skipped dependency-review (PR-only) upstream of ci-ok skips this job too
    if: ${{ !cancelled() && needs.ci-ok.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://hire-excellence.n1m35h.in
    # Never run two deploys at once; a newer merge waits for the running one instead of racing its D1 migrations
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: write # release tag + GitHub Release
      id-token: write # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags, to find the last release
          persist-credentials: false # the release step uses GH_TOKEN; don't leave a token in .git/config next to the Cloudflare one
      # Next version = last v* tag + 1 patch. Put [minor] or [major] in the PR title for a bigger bump.
      # Safe without locking: the concurrency group above runs deploys one at a time.
      - name: Next version
        id: version
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$last" ]; then echo "tag=v1.0.0" >> "$GITHUB_OUTPUT"; exit 0; fi
          IFS=. read -r major minor patch <<< "${last#v}"
          msg=$(git log -1 --format=%B)
          if [[ $msg == *"[major]"* ]]; then major=$((major+1)); minor=0; patch=0
          elif [[ $msg == *"[minor]"* ]]; then minor=$((minor+1)); patch=0
          else patch=$((patch+1)); fi
          echo "tag=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build (bakes in NEXT_PUBLIC_* from GitHub environment variables), apply D1 migrations, deploy.
      # Runtime secrets are NOT here: they live on the Worker (`wrangler secret`) and survive every deploy.
      # --tag labels the Cloudflare Worker version with the release, so a rollback target is easy to find
      # The API token needs Edit on Workers Scripts, D1, Workers KV Storage, Queues and R2 (every binding in wrangler.jsonc)
      - run: npm run deploy -- --tag "$TAG" --message "$TAG (${GITHUB_SHA::7})"
        env:
          TAG: ${{ steps.version.outputs.tag }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${{ vars.NEXT_PUBLIC_CLERK_SIGN_IN_URL }}
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${{ vars.NEXT_PUBLIC_CLERK_SIGN_UP_URL }}
          NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: ${{ vars.NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL }}
          NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: ${{ vars.NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL }}
          NEXT_PUBLIC_CLERK_KEYLESS_DISABLED: ${{ vars.NEXT_PUBLIC_CLERK_KEYLESS_DISABLED }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
      # Smoke test the live site; on failure, put the previous Worker version back and fail the run.
      # D1 migrations are forward-only and stay applied, so keep them additive (expand first, drop columns a release later).
      - name: Smoke test (rollback on failure)
        run: |
          if curl -fsS --retry 5 --retry-delay 5 --retry-all-errors https://hire-excellence.n1m35h.in/api/health && curl -fsS -o /dev/null https://hire-excellence.n1m35h.in/; then exit 0; fi
          npx wrangler rollback -y --message "smoke test failed for $TAG"
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ steps.version.outputs.tag }}
      # Signed SLSA provenance for exactly what was deployed; verify with `gh attestation verify <file> -R <repo>`
      - name: Package build
        run: tar -czf "hire-excellence-$TAG.tar.gz" dist
        env:
          TAG: ${{ steps.version.outputs.tag }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: hire-excellence-*.tar.gz
      # Only reached when the deploy succeeded. Notes list the PRs merged since the previous release.
      - name: Create GitHub Release
        run: gh release create "$TAG" "hire-excellence-$TAG.tar.gz" --target "$GITHUB_SHA" --title "$TAG" --generate-notes --notes "Deployed to https://hire-excellence.n1m35h.in (Cloudflare Worker version tag \`$TAG\`)."
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
      # Queue this release for /changelog: the cron (lib/changelog.ts) writes the member-facing entry from the merged
      # PR's title and description, or skips it when nothing changed for members. Never fails the deploy.
      - name: Queue changelog entry
        continue-on-error: true
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0] // {} | {title, body}' > pr.json
          node scripts/changelog-pending.mjs > changelog.sql
          npx wrangler d1 execute hire-excellence-db --remote --file changelog.sql
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
